<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#b83c3c">
    <title>Minha Pokédex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <form class="search-form" id="formulario">
            <label class="sr-only" for="input">Nome ou número do Pokémon</label>
            <input
                type="search"
                id="input"
                placeholder="Nome ou número do Pokémon"
                autocomplete="off"
                required
            >
            <button id="botao" type="submit">Buscar</button>
        </form>

        <div class="pokedex" aria-label="Pokédex">
            <section id="resultado" class="pokemon-card" aria-live="polite" aria-atomic="true">
                <p class="empty-state">Busque um Pokémon<br>para começar!</p>
            </section>
        </div>
    </main>

    <script src="sricpt.js"></script>
</body>
</html>
